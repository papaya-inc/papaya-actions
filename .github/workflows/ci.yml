name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, 'feature/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-workflows:
    name: Validate workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/actionlint@v1
